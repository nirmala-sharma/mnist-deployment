<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MNIST Digit Classifier</title>
    <style>
        body {
            background: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 20px; }
        canvas {
            border: 3px solid #fff;
            border-radius: 8px;
            cursor: crosshair;
            background: black;
        }
        .buttons { margin-top: 15px; display: flex; gap: 10px; }
        button {
            padding: 10px 25px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        #predictBtn { background: #4CAF50; color: white; }
        #clearBtn { background: #e74c3c; color: white; }
        #result {
            margin-top: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <h1>✏️ MNIST Digit Classifier</h1>
    <p>Draw a digit (0-9) below and click Predict</p>
    <canvas id="canvas" width="280" height="280"></canvas>
    <div class="buttons">
        <button id="predictBtn">Predict</button>
        <button id="clearBtn">Clear</button>
    </div>
    <div id="result"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 18;
        ctx.lineCap = 'round';

        canvas.addEventListener('mousedown', () => drawing = true);
        canvas.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });
        canvas.addEventListener('mousemove', (e) => {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            document.getElementById('result').innerText = '';
        });

        document.getElementById('predictBtn').addEventListener('click', () => {
        const offscreen = document.createElement('canvas');
        offscreen.width = 280;
        offscreen.height = 280;
        const offCtx = offscreen.getContext('2d');
        offCtx.drawImage(canvas, 0, 0, 280, 280);
        const imageData = offscreen.toDataURL('image/png');            fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('result').innerText = '🔢 Predicted Digit: ' + data.prediction;
            });
        });
    </script>
</body>
</html>
